<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable: this is a standalone app, not a page, and iOS
         honours both in standalone mode. Without them a tap on the composer
         focus-zooms, and a zoomed visual viewport is indistinguishable from a
         keyboard to visualViewport.height (see lib/viewport.ts). Pinch-zoom as an
         accessibility affordance is given up deliberately; the type scale is
         built for the phone and Dynamic Type is the remaining lever. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#25221F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alfred" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Alfred</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
