id: reflex.asks.scripts_only_asked
prd: [4.4.tiered-autonomy]
status: shipped
tags: [asks, scripts]
steps:
  # Evening, well outside the default quiet hours (23:00 to 07:00), so no hold for them can
  # stand in for what this golden pins. Scripts and lights may be asked about: a script is an
  # elevated tool, which Reflex may only ever ask about, and only because its tool is named here.
  - clock: {hour: 21}
  - reflex_settings: {mode: ask, ask_tools: ["home.script_*", "home.light_*"]}
  # The sun goes down first, as in the other evening goldens.
  - ha_event: {entity_id: sun.sun, state: below_horizon}
  # A person starts a film on the living room TV: the moment a script called "Movie night" is
  # tempting. The TV was off, so this is a real transition. It is the person's change to the TV,
  # not the script's, so the script is not left alone and a proposal for it reaches the ask gate.
  - ha_event: {entity_id: media_player.living_room_tv, state: playing, by: person.sam}
  # An ask is parked just after the model answers: this step is the snapshot that shows it.
  - wait: 6
expect:
  # Whatever the model proposes for the script ends as an ask, a hold or nothing: never a
  # shadow that is left standing, and never an act. It may well say nothing, or turn to the
  # lights or the scene instead (not the script, so this check has nothing to judge and
  # passes); the unit tests pin the ask path itself, which this golden does not need the model
  # to reach.
  - reflex_outcome: {target: script.movie_night, outcome: [asked, held, none]}
  # And nothing ran the script: no yes was given, so the fake HA never saw script.turn_on.
  - ha_not_called: {domain: script, service: turn_on}
