id: notifications.dnd.released_when_off
prd: [principle.1, 4.2.notification-delivery]
status: shipped
tags: [dnd]
steps:
  - dnd: on
    settle: 0  # the admin API sets the key before it answers; nothing to wait for
  - user: "Remind me in 10 minutes to call the vet."
  - advance_trigger: {}
  - dnd: off
    settle: 5  # the drain runs in the conscious process, over the actions stream
expect:
  - trigger_created: {type: time}
  # Fired well within the advance's wait (the driver's fire_timeout_s, 15 s), so before
  # `dnd: off`: the notification below is the drain's, not a late fire's sent straight
  # through. A fire at 15 s could reach the dispatcher after `dnd: off`, so the guard is
  # tighter than the wait.
  - trigger_fired: {after_step: 2, within_s: 12}
  - notification: {source: trigger-engine, after_step: 3}
