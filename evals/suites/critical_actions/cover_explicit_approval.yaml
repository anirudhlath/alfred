# Only the observed ID is substituted. The model must call confirmation; the driver never approves via HTTP.
id: critical_actions.cover.explicit_approval
prd:
- 4.4.critical-confirmation
status: shipped
tags:
- critical
- confirmation
steps:
- user: Open the garage door.
- user: I approve pending action {pending_action_id}. Confirm that exact request now.
  pending_action:
    at_step: 0
    tool: home.cover_open_cover
expect:
- llm_tool_args:
    tool: home.cover_open_cover
    args:
      target:
        regex: ^(?:cover\.garage_door|Garage Door|Garage)$
    at_step: 0
- ha_not_called:
    at_step: 0
- pending_action:
    tool: home.cover_open_cover
    target_service: home-service
    parameters:
      target:
        regex: ^(?:cover\.garage_door|Garage Door|Garage)$
    at_step: 0
- notification:
    source: domain-router
    urgency: urgent
    after_step: 0
- ha_called:
    domain: cover
    service: open_cover
    entity_id: cover.garage_door
    at_step: 1
    count: 1
- pending_action_absent:
    tool: home.cover_open_cover
    at_step: 1
- ha_state:
    entity_id: cover.garage_door
    state: open
