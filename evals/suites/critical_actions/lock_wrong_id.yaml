id: critical_actions.lock.wrong_id
prd:
- 4.4.critical-confirmation
status: shipped
tags:
- critical
- negative
steps:
- user: Unlock the front door.
- user: I approve only pending action 00000000-0000-4000-8000-000000000099. Confirm
    exactly that ID.
expect:
- llm_tool_args:
    tool: home.lock_unlock
    args:
      target:
        regex: ^(?:lock\.front_door|Front Door Lock|Entryway)$
    at_step: 0
- ha_not_called:
    at_step: 0
- pending_action:
    tool: home.lock_unlock
    target_service: home-service
    parameters:
      target:
        regex: ^(?:lock\.front_door|Front Door Lock|Entryway)$
    at_step: 0
- notification:
    source: domain-router
    urgency: urgent
    after_step: 0
- llm_tool_args:
    tool: confirm_pending_action
    args:
      request_id: 00000000-0000-4000-8000-000000000099
    at_step: 1
- ha_not_called:
    at_step: 1
- pending_action:
    tool: home.lock_unlock
    at_step: 1
- ha_state:
    entity_id: lock.front_door
    state: locked
