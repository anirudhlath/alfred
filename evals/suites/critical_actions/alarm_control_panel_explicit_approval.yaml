# Only the observed ID is substituted. The model must call confirmation; the driver never approves via HTTP.
id: critical_actions.alarm_control_panel.explicit_approval
prd:
- 4.4.critical-confirmation
status: shipped
tags:
- critical
- confirmation
steps:
- ha_event:
    entity_id: alarm_control_panel.home_alarm
    state: armed_away
- user: Disarm the home alarm.
- user: I approve pending action {pending_action_id}. Confirm that exact request now.
  pending_action:
    at_step: 1
    tool: home.alarm_control_panel_alarm_disarm
expect:
- llm_tool_args:
    tool: home.alarm_control_panel_alarm_disarm
    args:
      target:
        regex: ^(?:alarm_control_panel\.home_alarm|Home Alarm|Entryway)$
    at_step: 1
- ha_not_called:
    at_step: 1
- pending_action:
    tool: home.alarm_control_panel_alarm_disarm
    target_service: home-service
    parameters:
      target:
        regex: ^(?:alarm_control_panel\.home_alarm|Home Alarm|Entryway)$
    at_step: 1
- notification:
    source: domain-router
    urgency: urgent
    after_step: 1
- tool_called:
    tool: confirm_pending_action
    at_step: 2
- ha_called:
    domain: alarm_control_panel
    service: alarm_disarm
    entity_id: alarm_control_panel.home_alarm
    at_step: 2
    count: 1
- pending_action_absent:
    tool: home.alarm_control_panel_alarm_disarm
    at_step: 2
- ha_state:
    entity_id: alarm_control_panel.home_alarm
    state: disarmed
