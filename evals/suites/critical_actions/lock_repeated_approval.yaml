# The owner says yes, then taps Confirm on the Door for the same approval. The first decision claims
# the record, so the second finds nothing (404) and the door is unlocked once.
id: critical_actions.lock.repeated_approval
prd:
- 4.4.critical-confirmation
status: shipped
tags:
- critical
- confirmation
- negative
steps:
- user: Unlock the front door.
- user: Yes, go ahead.
- door: confirm
  pending_action:
    at_step: 0
    tool: home.lock_unlock
expect:
- llm_tool_args:
    tool: home.lock_unlock
    args:
      target:
        regex: ^(?:lock\.front_door|Front Door Lock|Entryway)$
    at_step: 0
- ha_not_called:
    at_step: 0
- pending_action:
    tool: home.lock_unlock
    target_service: home-service
    parameters:
      target:
        regex: ^(?:lock\.front_door|Front Door Lock|Entryway)$
    at_step: 0
- notification:
    source: conscious-engine
    urgency: urgent
    after_step: 0
- ha_called:
    domain: lock
    service: unlock
    entity_id: lock.front_door
    at_step: 1
    count: 1
- ha_not_called:
    at_step: 2
- ha_called:
    domain: lock
    service: unlock
    entity_id: lock.front_door
    count: 1
- pending_action_absent:
    tool: home.lock_unlock
    at_step: 1
- pending_action_absent:
    tool: home.lock_unlock
    at_step: 2
- ha_state:
    entity_id: lock.front_door
    state: unlocked
