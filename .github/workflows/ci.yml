name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # home-service is baked into the fat image and has no deployment of its own; a merge
  # there fires this so alfred is rebuilt with the new home-service on the trunk.
  repository_dispatch:
    types: [home-service-merged]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      mypy-targets: "alfredctl/ bus/ core/ domains/ evals/ runner/ sdk/ shared/ telemetry/"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist

  # web/dist never existed in CI, so mount_spa route-shadowing bugs were invisible.
  spa:
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-dist
          path: web/dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest tests/core/channels/test_spa_ci.py -q

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf)(\([a-zA-Z0-9._/ -]+\))?!?: .+$'; then
            echo "::error::PR title must be a conventional commit line: type(scope)!?: subject, type in feat|fix|chore|docs|refactor|test|ci|perf"
            exit 1
          fi
      - name: Not a PR — nothing to validate
        if: github.event_name != 'pull_request'
        run: echo "push event"

  artifact-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block oversized or suspicious tracked files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              uv.lock|web/package-lock.json|docs/assets/*|web/public/*) continue ;;
            esac
            if [ "$(wc -c < "$f")" -gt 1048576 ]; then
              echo "::error::$f exceeds 1MB — move binaries to docs/assets/ or keep them out of git"
              fail=1
            fi
          done < <(git ls-files)
          bad=$(git ls-files | grep -E '^-|[<>|;&`$]' || true)
          if [ -n "$bad" ]; then
            echo "::error::suspicious filename(s) tracked: $bad"
            fail=1
          fi
          exit $fail

  # Job id `gate`, display name `ci-ok`. The id is what `needs.` expressions below refer
  # to, and `needs.ci-ok.result` would parse as a subtraction — hyphens are not legal in a
  # property path. The required-check setting matches the NAME, so it is unaffected.
  gate:
    name: ci-ok
    if: always()
    needs: [python, web, spa, pr-title, artifact-guard]
    runs-on: ubuntu-latest
    steps:
      - name: All gates green?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::a required job did not succeed"
            exit 1
          fi

  deploy:
    name: deploy to lath-server
    needs: [gate]
    # `always() &&` is load-bearing. Without it this job inherits the implicit success()
    # check, and a SKIPPED job anywhere upstream propagates down the needs graph even when
    # `gate` itself succeeded — a deploy that silently skips on every push. Taking over the
    # condition with always() stops the propagation; the explicit result check is then what
    # gates the deploy. This cost ha-home-panel a run to diagnose.
    if: >-
      ${{ always()
      && needs.gate.result == 'success'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/master')
      || github.event_name == 'repository_dispatch') }}
    runs-on: [self-hosted, linux, alfred-deploy]
    timeout-minutes: 60
    # Two deploys at once would race between building an image and starting the container
    # it replaces. Queue, never cancel.
    concurrency:
      group: deploy-alfred
      cancel-in-progress: false
    env:
      DEPLOY_DIR: /home/anirudhlath/code/alfred-deploy
    steps:
      # Both repos as siblings under $GITHUB_WORKSPACE: the fat image build stages
      # `git ls-files` from each, resolving home-service as a sibling of the alfred
      # checkout. A nested checkout would not be found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: alfred
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anirudhlath/alfred-home-service
          path: home-service

      # The box's system Python is 3.14; a fresh checkout would otherwise default to it.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          # Self-hosted: the runner's HOME is the real user's ~/.cache/uv, already
          # persistent across runs. enable-cache would run `uv cache prune --ci` against
          # that cache every deploy and round-trip it to the GitHub Actions cache over
          # WAN for no benefit, competing with the spa/voice-smoke jobs for the repo's
          # 10GB quota.
          enable-cache: false
      - name: Install alfredctl
        working-directory: alfred
        run: uv sync

      # Before the build, not after: a misconfigured box should fail in seconds rather than
      # after a full fat-image build. Offline because a deploy must not fail on a transient
      # outage of an external endpoint — what is checked is that the config is sane.
      - name: Preflight
        working-directory: alfred
        run: uv run alfredctl doctor --offline --env-file "$DEPLOY_DIR/.env"

      - name: Record the running image for rollback
        id: rollback
        run: |
          # `alfred` is the pinned container_name (Phase 2a). `alfred-alfred-1` is the
          # compose-default name the container had before that pin took effect — kept as
          # a fallback purely so the first deploy under this workflow still finds a
          # rollback target instead of treating it as a from-scratch deploy.
          if id=$(docker inspect -f '{{.Image}}' alfred 2>/dev/null) \
             || id=$(docker inspect -f '{{.Image}}' alfred-alfred-1 2>/dev/null); then
            docker tag "$id" alfred:rollback
            echo "image=$id" >> "$GITHUB_OUTPUT"
            echo "rollback target: $id"
          else
            echo "image=none" >> "$GITHUB_OUTPUT"
            echo "::notice::no running alfred container — first deploy, nothing to roll back to"
          fi

      - name: Build
        working-directory: alfred
        run: |
          uv run alfredctl build --tag alfred:latest
          docker tag alfred:latest "alfred:${{ github.sha }}"

      # Copied, not symlinked: the deploy workspace must keep working when the runner wipes
      # its checkout between runs.
      - name: Publish the compose file to the deploy workspace
        run: cp alfred/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"

      - name: Start
        id: start
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Written BEFORE the command, not after: `docker compose up -d` stops and renames
          # the running container before it creates the replacement, so a failure part-way
          # through leaves alfred down. The marker must mean "we were about to replace the
          # container", not "we succeeded" — otherwise the rollback below cannot fire for
          # the very failure it exists to catch.
          echo "started=1" >> "$GITHUB_OUTPUT"
          docker compose up -d

      # Polls /health, then checks redis, the RediSearch modules and mosquitto INSIDE the
      # running container. `--name alfred` matches the pinned container_name.
      - name: Verify
        id: verify
        working-directory: alfred
        run: uv run alfredctl smoke --attach --name alfred

      # `always()` replaces `failure()` here: `failure()` is false when the job is
      # cancelled or hits `timeout-minutes`, so a cancel mid-Verify would leave alfred
      # running an unverified image with rollback silently skipped. Gating on the
      # `started` output (not `steps.start.outcome`/`steps.verify.outcome`) is deliberate
      # too — a step's `outcome` is not reliably `'skipped'` for a step that never ran, so
      # the explicit marker is the only safe signal that Start actually replaced the
      # running container. `set +e` in the script below keeps every diagnostic path
      # reachable even if `docker tag` or the rollback's `docker compose up -d` itself
      # fails — otherwise bash's default `-e` would abort mid-script and the final
      # "rollback did not verify" error would never print. A rollback that itself fails
      # is louder, not quieter: the script exits non-zero either way.
      - name: Roll back
        if: always() && steps.start.outputs.started == '1' && steps.verify.outcome != 'success'
        env:
          TARGET: ${{ steps.rollback.outputs.image }}
        run: |
          set +e
          if [ "$TARGET" = "none" ]; then
            echo "::error::deploy failed and there is no previous image to restore"
            exit 1
          fi
          echo "::warning::deploy failed — restoring $TARGET"
          docker tag "$TARGET" alfred:latest
          cd "$DEPLOY_DIR"
          docker compose up -d
          cd "$GITHUB_WORKSPACE/alfred"
          if uv run alfredctl smoke --attach --name alfred; then
            echo "::error::deploy failed; rolled back to $TARGET and it verified"
          else
            echo "::error::deploy failed AND the rollback to $TARGET did not verify — alfred may be down"
          fi
          exit 1

      # Keeps disk growth bounded. Every `Build` step above pins a new `alfred:<sha>` tag
      # forever with nothing to prune it otherwise — measured on this box, `alfred:latest`
      # alone is ~8.8GB unique, images + build cache already reclaim 200GB+, and
      # /var/lib/docker shares the LUKS btrfs root with Home Assistant, vLLM and
      # ~/models. Runs even when the deploy failed so a bad run doesn't also leak disk.
      # `latest` and `rollback` never match the 40-hex-char SHA pattern below, so they
      # are excluded by construction, not by name-listing. Pruning a tag whose image
      # backs the running container only removes the *tag*, not the image, so this
      # cannot affect the live deployment.
      - name: Prune old deploy images
        if: always()
        run: |
          set +e
          stale=$(docker images alfred --format '{{.CreatedAt}}|{{.Tag}}' \
            | grep -E '\|[0-9a-f]{40}$' \
            | sort -r \
            | tail -n +6 \
            | cut -d'|' -f2)
          if [ -n "$stale" ]; then
            echo "removing stale deploy image tags:"
            echo "$stale"
            echo "$stale" | xargs -I{} docker rmi "alfred:{}"
          else
            echo "no stale deploy image tags eligible for removal"
          fi
          # `docker builder prune` is global, not alfred-scoped — it also evicts build
          # cache belonging to the other projects on this box (usher, usher-web,
          # ha-home-panel, comfyui). 14 days is the gentler setting; 7 was costing them
          # occasional cold rebuilds.
          docker builder prune --filter until=336h -f
          exit 0
