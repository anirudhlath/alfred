# Alfred — production deployment. One fat image, external state in named volumes.
#
#   cp .env.example .env      # fill in OPENROUTER_API_KEY (+ HA_TOKEN for home control)
#   uv run alfredctl doctor   # optional: validate .env before starting
#   uv run alfredctl build --tag alfred:latest
#   docker compose up -d
#
# Host-service hosts (OLLAMA_HOST, OPENAI_COMPAT_HOST, HA_HOST, …) may use `localhost`:
# the container rewrites it to the host gateway automatically. The secrets passphrase is
# generated and persisted in the data volume on first boot — no manual step required
# (override with ALFRED_SECRETS_PASSPHRASE in .env to pin your own).
services:
  alfred:
    image: alfred:latest
    env_file: .env
    environment:
      ALFRED_DATA_MODE: persistent
    volumes:
      - alfred_data:/data
      - alfred_models:/models
    ports:
      - "8081:8081"
      # - "1883:1883"   # opt-in: real Home Assistant publishing to the edge broker
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host services
    restart: unless-stopped
volumes:
  alfred_data:
  alfred_models:
